build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "jupyter>=1.0.0",
    "notebook>=6.4.0",
    "ipywidgets>=7.6.0",
]

[tool.uv.sources]
# 如果需要从特定源安装某些包，可以在这里配置
# modelscope = { git = "https://github.com/modelscope/modelscope.git" }
# ms-swift = { git = "https://github.com/modelscope/swift.git" }

[tool.uv.workspace]
# 工作空间配置
members = ["."]

[tool.uv.index]
# 使用清华镜像源加速下载
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"